<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>orbit-lab</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.75rem 1rem}
  h1{margin:0;font-size:1.1rem}
  label{display:flex;align-items:center;gap:.5rem;color:var(--muted)}
  input{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--muted);border-radius:6px;padding:.25rem .5rem;color-scheme:inherit}
  input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #message{min-height:1.5em;margin:0;padding:0 1rem;color:var(--accent)}
  main{flex:1;min-height:0;display:flex}
  canvas{flex:1;width:100%;min-height:320px;display:block}
  footer{padding:.5rem 1rem;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1>orbit-lab</h1>
  <label>Date <input id="date" type="date" autocomplete="off"></label>
</header>
<p id="message" role="status" aria-live="polite"></p>
<main><canvas id="view" role="img" aria-label="The eight planets on their orbits around the Sun, seen from above the ecliptic"></canvas></main>
<footer>Looking down on the ecliptic. Distances from the Sun are drawn on a square-root scale so the inner planets are visible. Earth is the Earth-Moon barycentre.</footer>
<script type="module" src="main.js"></script>
</body>
</html>
